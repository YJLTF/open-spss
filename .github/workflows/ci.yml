name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]        # 不加 tags 时,限定 branches 会连带排除 tag 推送
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: 文档一致性(README 计数与模型注册表同步)
        run: python scripts/sync_models.py --check
      - name: pytest(全模型冒烟 + 单元测试)
        run: |
          set +e
          pytest tests/ -q --tb=line > /tmp/pytest.log 2>&1
          code=$?
          tail -25 /tmp/pytest.log
          grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -10 | while IFS= read -r ln; do echo "::error title=pytest::$ln"; done
          grep -E "^[^ ].* (Error|Exception)" /tmp/pytest.log | head -10 | while IFS= read -r ln; do echo "::error title=tb::$ln"; done
          exit $code

  wheel:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  exe:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[exe]"
      - run: pyinstaller openspss.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/OpenSPSS.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 提取发布说明
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > body.md
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: dist
      - name: 创建 GitHub Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "OpenSPSS $GITHUB_REF_NAME" \
            --notes-file body.md \
            dist/OpenSPSS.exe dist/*.whl
